server:
  port: 8080

spring:
  application:
    name: investwallet-api

  datasource:
    url: jdbc:mysql://localhost:3306/investwallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: sptech
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtcmFuZG9tLWtleS1pbi1wcm9kdWN0aW9uLWVudmlyb25tZW50LXBsZWFzZQ==
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

google:
  client-id: ${GOOGLE_CLIENT_ID:746596332991-idgkstpag27irajp94alpdfec9sl4l47.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

investwallet:
  recomendacoes:
    cron: ${RECOMENDACOES_CRON:0 0 3 ? * SUN}
  ia:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}

logging:
  level:
    com.wallet.md: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
